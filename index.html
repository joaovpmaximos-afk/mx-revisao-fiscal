<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão Fiscal — MAXIMOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ----------------------------------------------------------------------
   Identidade visual MAXIMOS — kit oficial de 21/09/2026
   (Documentos\MAXIMOS\_IDENTIDADE VISUAL\maximos-tokens.css)
   Valores copiados do kit. As 4 regras da casa valem aqui:
     1) um azul, em pouca coisa: só ação principal, foco do campo e item ativo
     2) nada de rótulo em MAIÚSCULAS, caixa colorida ou emoji
     3) estado = cor de texto/borda/bolinha; o fundo continua neutro
     4) texto sério e simples
   ---------------------------------------------------------------------- */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#f6f7f8; --surface-3:#eef1f3;
  --text:#1f2328; --muted:#6b7178; --border:#dde1e6; --border-strong:#c7ccd2;
  --brand:#0091ff; --brand-light:#35a9ff; --brand-soft:#d8eeff;
  --ok:#047857; --red:#dc2626; --yellow:#d9a406; --blue:#3b6f8a;
  --font-text:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-display:"Sora",sans-serif;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,20,20,.06),0 8px 24px rgba(20,20,20,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171717; --surface:#212121; --surface-2:#272727; --surface-3:#2d2d2d;
  --text:#eaeaea; --muted:#9c9c9c; --border:#363636; --border-strong:#4a4a4a;
  --brand:#40a9ff; --brand-light:#73c3ff; --brand-soft:#01345e;
  --ok:#34d399; --red:#f06262; --yellow:#e0b43a; --blue:#6fa6c2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-text);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em}

.topo{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topo-in{max-width:1500px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:11px}
.marca img{height:30px;width:auto;display:block}
.marca .para-claro{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .marca .para-escuro{display:none}
  :root:not([data-theme="light"]) .marca .para-claro{display:block}
}
.marca .onde{font-family:var(--font-display);font-weight:600;font-size:15px;
  padding-left:11px;border-left:1px solid var(--border)}
.topo .quem{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.wrap{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}

.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;
  padding:7px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--brand-light);border-color:var(--brand-light)}
.btn:disabled{opacity:.5;cursor:default}
input{border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;
  padding:9px 12px;font:inherit;font-size:14px;color:var(--text);width:100%}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 5px}

#login{max-width:370px;margin:9vh auto;box-shadow:var(--shadow)}
#login h2{font-size:19px;margin-bottom:3px}
#login .sub{font-size:13px;color:var(--muted);margin-bottom:6px}

/* números: o destaque vem do peso da fonte, não de caixa colorida */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
.kpi .n{font-family:var(--font-display);font-size:25px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi.verm .n{color:var(--red)} .kpi.amar .n{color:var(--yellow)} .kpi.verde .n{color:var(--ok)}

.tabs{display:flex;gap:2px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:9px;font-size:13.5px;color:var(--muted);cursor:pointer;
  border:1px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand);border-color:var(--border);background:var(--surface);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 12px;border:1px solid var(--border);border-radius:999px;font-size:13px;
  cursor:pointer;color:var(--muted);background:var(--surface)}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.on{border-color:var(--brand);color:var(--brand);font-weight:600}

.rolagem{overflow-x:auto;border:1px solid var(--border);border-radius:11px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
thead th{font-size:12.5px;color:var(--muted);background:var(--surface-2);font-weight:500;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}

/* estado por cor de TEXTO e bolinha; o fundo continua neutro (regra 3) */
.selo{display:inline-block;font-size:12.5px;margin:0 10px 2px 0;white-space:nowrap;color:var(--muted)}
.selo::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:currentColor;margin-right:6px;vertical-align:1.5px}
.selo.r{color:var(--red)} .selo.a{color:var(--yellow)} .selo.v{color:var(--ok)}
.selo.forte{font-weight:600}
.mini{font-size:12.5px;color:var(--muted);margin-top:2px}

.grupo{border:1px solid var(--border);border-radius:11px;margin-bottom:12px;overflow:hidden}
.grupo-cab{padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.grupo .rolagem{border:0;border-radius:0}
.vazio{padding:30px;text-align:center;color:var(--muted);font-size:13.5px}
.aviso{background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-left:3px solid var(--yellow);border-radius:11px;padding:11px 15px;margin-bottom:14px;font-size:13.5px}
.erro{color:var(--red);border:1px solid var(--red);border-radius:9px;padding:9px 12px;
  margin-top:12px;font-size:13px;background:var(--surface)}
.oculto{display:none!important}

.linha-hist>td{background:var(--surface-2);padding:13px}
.hist-bloco{margin-bottom:14px}
.hist-bloco:last-child{margin-bottom:0}
.hist-tit{font-family:var(--font-display);font-size:13px;font-weight:600;margin-bottom:7px}
.hist-tab{font-size:12.5px;background:var(--surface)}
.hist-tab td,.hist-tab th{white-space:nowrap;text-align:right}
.hist-tab td:first-child,.hist-tab th:first-child{text-align:left;position:sticky;left:0;
  background:var(--surface);z-index:2}
.hist-tab thead th:first-child{background:var(--surface-2)}
/* o mês do alerta se destaca por BORDA e peso, não por fundo colorido */
.hist-tab .alvo{box-shadow:inset 2px 0 0 var(--yellow),inset -2px 0 0 var(--yellow);font-weight:600}
.hist-tab thead th.alvo{box-shadow:inset 2px 0 0 var(--yellow),inset -2px 0 0 var(--yellow),inset 0 2px 0 var(--yellow)}
.hist-tag{font-size:12px;font-weight:500;color:var(--yellow)}
</style>
</head>
<body>

<div class="topo"><div class="topo-in">
  <div class="marca">
    <img class="para-escuro" src="logos/logo-claro.png" alt="MAXIMOS" width="142" height="30">
    <img class="para-claro" src="logos/logo-escuro.png" alt="MAXIMOS" width="142" height="30">
    <span class="onde">Revisão Fiscal</span>
  </div>
  <div class="quem oculto" id="barraQuem">
    <span id="quemEmail"></span>
    <button class="btn" id="btnAtualizar">Atualizar</button>
    <button class="btn" id="btnSair">Sair</button>
  </div>
</div></div>

<div class="wrap">

  <div class="card" id="login">
    <h2>Entrar</h2>
    <div class="sub">Use a mesma conta do portal MAXIMOS.</div>
    <form id="formLogin">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button class="btn pri" style="width:100%;margin-top:14px" id="btnEntrar">Entrar</button>
      <div class="erro oculto" id="erroLogin"></div>
    </form>
  </div>

  <div id="painel" class="oculto">
    <div id="avisos"></div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="visao">
      <div class="tab on" data-v="cliente">Por cliente</div>
      <div class="tab" data-v="colaborador">Por colaborador</div>
      <div class="tab" data-v="maquina">Por máquina</div>
    </div>
    <div class="chips" id="filtros"></div>
    <div id="lista"></div>
  </div>

</div>

<script>
const URL_BASE = 'https://fxbekqnbpumkpwitrsju.supabase.co';
const CHAVE = 'sb_publishable_guki9WWcXJyVeM3N9pi1mA_ea6ypphQ';
const GUARDA = 'rfis.sessao';
const DIAS_SEM_PUBLICAR = 2;   // acima disso, a maquina vira aviso

let SESSAO = null, DADOS = [], visao = 'cliente', filtro = 'todos';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const brl = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtMes = c => (c ? String(c).split('-').reverse().join('/') : '');
const fmtData = d => (d ? String(d).slice(0, 10).split('-').reverse().join('/') : '');
const fmtCnpj = c => String(c).replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
const hojeISO = () => new Date().toISOString().slice(0, 10);
function dias(de, ate) {
  if (!de) return null;
  const a = Date.parse(String(de).slice(0, 10) + 'T00:00:00Z');
  const b = Date.parse((ate || hojeISO()) + 'T00:00:00Z');
  return Number.isFinite(a) && Number.isFinite(b) ? Math.round((b - a) / 86400000) : null;
}
const emDias = n => (n === 0 ? 'hoje' : n === 1 ? 'ontem' : 'há ' + n + ' dias');
const pctTxt = v => (v == null ? '' : (v > 0 ? '+' : '') + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%');
const kpi = (l, n, cls) => `<div class="kpi ${cls || ''}"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`;

// ------------------------------------------------------------------ acesso
async function api(caminho, opcoes = {}) {
  const r = await fetch(URL_BASE + caminho, {
    ...opcoes,
    headers: { apikey: CHAVE, 'Content-Type': 'application/json', ...(opcoes.headers || {}) },
  });
  const t = await r.text();
  let c = null;
  try { c = t ? JSON.parse(t) : null; } catch (_) { c = t; }
  if (!r.ok) throw new Error((c && (c.error_description || c.msg || c.message)) || ('HTTP ' + r.status));
  return c;
}

function guardar(s) {
  SESSAO = s;
  try { localStorage.setItem(GUARDA, JSON.stringify({ refresh: s.refresh_token, email: (s.user || {}).email || '' })); } catch (_) {}
}
function esquecer() {
  SESSAO = null;
  try { localStorage.removeItem(GUARDA); } catch (_) {}
}

async function entrar(email, senha) {
  guardar(await api('/auth/v1/token?grant_type=password', {
    method: 'POST', body: JSON.stringify({ email, password: senha }),
  }));
}

async function retomar() {
  let g = null;
  try { g = JSON.parse(localStorage.getItem(GUARDA) || 'null'); } catch (_) {}
  if (!g || !g.refresh) return false;
  try {
    guardar(await api('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', body: JSON.stringify({ refresh_token: g.refresh }),
    }));
    return true;
  } catch (_) { esquecer(); return false; }
}

async function carregar() {
  DADOS = await api('/rest/v1/fiscal_carteira?select=*&order=gravissimos.desc,abertos.desc,nome.asc', {
    headers: { Authorization: 'Bearer ' + SESSAO.access_token },
  });
}

// ------------------------------------------------------------------ desenho
function mostrarPainel() {
  $('#login').classList.add('oculto');
  $('#painel').classList.remove('oculto');
  $('#barraQuem').classList.remove('oculto');
  $('#quemEmail').textContent = (SESSAO.user || {}).email || '';
}

function desenhar() {
  if (!DADOS.length) {
    $('#avisos').innerHTML = '';
    $('#kpis').innerHTML = '';
    $('#filtros').innerHTML = '';
    $('#lista').innerHTML = '<div class="card vazio">Nenhuma empresa publicada ainda.<br>'
      + 'No MX CRÉDITOS de cada máquina, abra <b>Empresas</b> e clique em <b>Publicar carteira</b>.</div>';
    return;
  }

  // maquina que parou de publicar: o painel nao pode fingir que esta em dia
  const porMaquina = new Map();
  for (const e of DADOS) {
    const d = dias(e.publicado_em);
    if (!porMaquina.has(e.maquina) || d < porMaquina.get(e.maquina)) porMaquina.set(e.maquina, d);
  }
  const paradas = [...porMaquina.entries()].filter(([, d]) => d != null && d > DIAS_SEM_PUBLICAR);
  $('#avisos').innerHTML = paradas.length
    ? `<div class="aviso"><b>Atenção:</b> ${paradas.length === 1 ? 'uma máquina não publica' : paradas.length + ' máquinas não publicam'} `
      + `há mais de ${DIAS_SEM_PUBLICAR} dias — ${paradas.map(([m, d]) => `<b>${esc(m)}</b> (${emDias(d)})`).join(', ')}. `
      + 'O que aparece abaixo dessas máquinas pode estar desatualizado.</div>'
    : '';

  const soma = c => DADOS.reduce((s, e) => s + (e[c] || 0), 0);
  const vencidas = DADOS.filter(e => e.proximo_vencimento && e.proximo_vencimento < hojeISO()).length;
  const semResp = DADOS.filter(e => !e.responsavel).length;
  const aRean = DADOS.filter(e => !e.atualizada).length;
  $('#kpis').innerHTML = kpi('Empresas', DADOS.length)
    + kpi('Com alerta em aberto', DADOS.filter(e => e.abertos > 0).length, 'amar')
    + (soma('gravissimos') ? kpi('Gravíssimos', soma('gravissimos'), 'verm') : '')
    + (soma('graves') ? kpi('Graves', soma('graves'), 'amar') : '')
    + kpi('Divergências', soma('divergencias'), soma('divergencias') ? 'verm' : 'verde')
    + (vencidas ? kpi('Guia vencida', vencidas, 'verm') : '')
    + (aRean ? kpi('A reanalisar', aRean, 'amar') : '')
    + kpi('Máquinas publicando', porMaquina.size);

  const chip = (v, rot, n) => `<div class="chip ${filtro === v ? 'on' : ''}" data-f="${v}">${rot}${n != null ? ' (' + n + ')' : ''}</div>`;
  $('#filtros').innerHTML = chip('todos', 'Todas', DADOS.length)
    + chip('alerta', 'Com alerta', DADOS.filter(e => e.abertos > 0).length)
    + (soma('gravissimos') ? chip('grav', 'Gravíssimos') : '')
    + (vencidas ? chip('vencida', 'Guia vencida', vencidas) : '')
    + (aRean ? chip('rean', 'A reanalisar', aRean) : '')
    + (semResp ? chip('semresp', 'Sem responsável', semResp) : '');

  const lista = DADOS.filter(e => filtro === 'todos'
    || (filtro === 'alerta' ? e.abertos > 0
      : filtro === 'grav' ? e.gravissimos > 0
        : filtro === 'vencida' ? (e.proximo_vencimento && e.proximo_vencimento < hojeISO())
          : filtro === 'rean' ? !e.atualizada
            : filtro === 'semresp' ? !e.responsavel : true));

  $('#lista').innerHTML = !lista.length ? '<div class="card vazio">Nenhuma empresa neste filtro.</div>'
    : visao === 'cliente' ? tabela(lista) : agrupado(lista, visao);

  $$('#filtros .chip').forEach(el => el.addEventListener('click', () => { filtro = el.dataset.f; desenhar(); }));
  $$('[data-hist]').forEach(b => b.addEventListener('click', () => {
    const linha = document.querySelector('.linha-hist[data-de="' + b.dataset.hist.replace(/"/g, '\\"') + '"]');
    if (!linha) return;
    const aberto = !linha.classList.contains('oculto');
    linha.classList.toggle('oculto', aberto);
    b.textContent = aberto ? 'Histórico' : 'Fechar';
  }));
}

function agrupado(lista, por) {
  const chave = e => (por === 'colaborador' ? (e.responsavel || '') : e.maquina);
  const g = new Map();
  for (const e of lista) { if (!g.has(chave(e))) g.set(chave(e), []); g.get(chave(e)).push(e); }
  return [...g.entries()]
    .sort((a, b) => (a[0] ? 0 : 1) - (b[0] ? 0 : 1) || String(a[0]).localeCompare(String(b[0]), 'pt-BR'))
    .map(([quem, itens]) => {
      const grav = itens.reduce((s, e) => s + e.gravissimos, 0);
      const ab = itens.reduce((s, e) => s + e.abertos, 0);
      const pub = itens.reduce((m, e) => (!m || e.publicado_em > m ? e.publicado_em : m), '');
      return `<div class="grupo"><div class="grupo-cab">
        ${quem ? '<b>' + esc(quem) + '</b>' : '<b style="color:var(--muted)">Sem responsável definido</b>'}
        <span style="color:var(--muted)">· ${itens.length} empresa(s) · ${ab} em aberto</span>
        ${grav ? '<span class="selo r forte">' + grav + ' gravíssimo' + (grav > 1 ? 's' : '') + '</span>' : ''}
        ${por === 'maquina' && pub ? '<span style="margin-left:auto;color:var(--muted);font-size:12px">publicou ' + emDias(dias(pub)) + '</span>' : ''}
      </div>${tabela(itens)}</div>`;
    }).join('');
}

function tabela(lista) {
  const n = (v, cls, sing, plur) => (v ? `<span class="selo ${cls}">${v} ${v > 1 ? plur : sing}</span>` : '');
  return `<div class="rolagem"><table>
    <thead><tr><th>Empresa</th><th>Responsável</th><th>Última competência</th>
      <th>Em aberto</th><th>Prazo</th><th>Variação de valor</th><th>Publicado</th><th></th></tr></thead>
    <tbody>${lista.map(e => {
      const venc = e.proximo_vencimento ? dias(e.proximo_vencimento) : null;
      return `<tr>
      <td><b>${esc(e.nome || e.cnpj)}</b><div class="mini">${fmtCnpj(e.cnpj)}${e.uf ? ' · ' + esc(e.uf) : ''}</div></td>
      <td>${e.responsavel ? esc(e.responsavel) : '<span style="color:var(--muted)">—</span>'}</td>
      <td>${e.ultima_competencia ? fmtMes(e.ultima_competencia) : '<span style="color:var(--muted)">—</span>'}
        <div class="mini">${e.meses} mês(es)</div></td>
      <td>${!e.atualizada
        ? '<span class="selo a">a reanalisar</span><div class="mini">análise anterior ao alerta de variação</div>'
        : (n(e.gravissimos, 'r forte', 'gravíssimo', 'gravíssimos') + n(e.divergencias, 'r', 'divergência', 'divergências')
          + n(e.graves, 'a', 'grave', 'graves') + n(e.conferir, 'a', 'a conferir', 'a conferir')
          || '<span class="selo v">sem alerta</span>')}</td>
      <td>${venc != null
        ? `<span class="selo ${venc > 0 ? 'r forte' : venc >= -3 ? 'a' : ''}">Vcto ${fmtData(e.proximo_vencimento)} · `
          + (venc > 0 ? 'venceu ' + emDias(venc) : venc === 0 ? 'vence hoje' : 'vence em ' + (-venc) + ' dia' + (venc === -1 ? '' : 's')) + '</span>'
        : '<span style="color:var(--muted)">—</span>'}
        ${e.dias_aberto != null ? '<div class="mini">alerta aberto ' + emDias(e.dias_aberto) + '</div>' : ''}</td>
      <td>${(e.variacao || []).length
        ? (e.variacao || []).slice(0, 3).map(v => `<div class="mini"><b>${esc(v.tributo)}${v.escopo ? ' ' + esc(v.escopo) : ''}</b>
            ${fmtMes(v.competencia)} · ${esc(v.nivel)} · R$ ${brl(v.valor)}</div>`).join('')
          + ((e.variacao || []).length > 3 ? '<div class="mini">+' + ((e.variacao).length - 3) + ' outro(s)</div>' : '')
        : '<span style="color:var(--muted)">—</span>'}</td>
      <td class="mini">${esc(e.maquina)}<br>${emDias(dias(e.publicado_em))}</td>
      <td>${(e.historico || []).length
        ? `<button class="btn" data-hist="${esc(e.cnpj)}|${esc(e.maquina)}">Histórico</button>` : ''}</td>
    </tr>
    ${(e.historico || []).length ? `<tr class="linha-hist oculto" data-de="${esc(e.cnpj)}|${esc(e.maquina)}">
      <td colspan="8">${historicoMensal(e)}</td></tr>` : ''}`; }).join('')}</tbody></table></div>`;
}

/** o quadro mes a mes de cada tributo - imposto, receita, aliquota efetiva e referencia */
function historicoMensal(e) {
  const porTributo = new Map();
  for (const h of e.historico || []) {
    const k = h.tributo + (h.escopo ? ' ' + h.escopo : '');
    if (!porTributo.has(k)) porTributo.set(k, []);
    porTributo.get(k).push(h);
  }
  const alertado = new Set((e.variacao || []).map(v => v.tributo + (v.escopo ? ' ' + v.escopo : '') + '|' + v.competencia));
  return [...porTributo.entries()].map(([trib, linhas]) => {
    linhas.sort((a, b) => String(a.competencia).localeCompare(String(b.competencia)));
    const comReceita = linhas.filter(l => l.receita > 0);
    const med = v => (v.length ? v.reduce((s, x) => s + x, 0) / v.length : null);
    const mImp = med(linhas.map(l => l.imposto));
    const mRec = comReceita.length ? med(comReceita.map(l => l.receita)) : null;
    const mAli = comReceita.length ? med(comReceita.map(l => l.aliquotaEfetiva)) : null;
    const alvo = l => (alertado.has(trib + '|' + l.competencia) ? ' class="alvo"' : '');
    const cel = (l, html) => `<td${alvo(l)}>${html}</td>`;
    return `<div class="hist-bloco">
      <div class="hist-tit">${esc(trib)} — ${linhas.length} competência(s)</div>
      <div class="rolagem"><table class="hist-tab">
        <thead><tr><th>Indicador</th>${linhas.map(l =>
          `<th${alvo(l)} style="text-align:right">${fmtMes(l.competencia)}`
          + (alertado.has(trib + '|' + l.competencia) ? '<div class="hist-tag">alerta</div>' : '') + '</th>').join('')}
          <th style="text-align:right">Média</th></tr></thead>
        <tbody>
          <tr><td><b>Imposto</b><div class="mini">variação mensal</div></td>
            ${linhas.map((l, i) => cel(l, 'R$ ' + brl(l.imposto)
              + (i > 0 && linhas[i - 1].imposto > 0
                ? `<div class="mini">${pctTxt((l.imposto - linhas[i - 1].imposto) / linhas[i - 1].imposto * 100)}</div>` : ''))).join('')}
            <td>R$ ${brl(mImp)}</td></tr>
          ${comReceita.length ? `<tr><td><b>Receita bruta</b></td>
            ${linhas.map(l => cel(l, l.receita > 0 ? 'R$ ' + brl(l.receita) : '—')).join('')}
            <td>${mRec != null ? 'R$ ' + brl(mRec) : '—'}</td></tr>
          <tr><td><b>Alíquota efetiva</b></td>
            ${linhas.map(l => cel(l, l.aliquotaEfetiva != null
              ? pctTxt(l.aliquotaEfetiva).replace('+', '') + `<div class="mini">${brl(l.imposto)} ÷ ${brl(l.receita)}</div>` : '—')).join('')}
            <td>${mAli != null ? pctTxt(mAli).replace('+', '') : '—'}</td></tr>` : ''}
          <tr><td><b>Referência (mediana)</b></td>
            ${linhas.map(l => cel(l, l.referencia != null ? 'R$ ' + brl(l.referencia)
              + (l.variacaoPct != null ? `<div class="mini">${pctTxt(l.variacaoPct)}</div>` : '') : '—')).join('')}
            <td></td></tr>
          ${linhas.some(l => l.vencimento) ? `<tr><td><b>Vencimento da guia</b></td>
            ${linhas.map(l => cel(l, l.vencimento ? fmtData(l.vencimento) : '—')).join('')}
            <td></td></tr>` : ''}
        </tbody></table></div></div>`;
  }).join('');
}

// ------------------------------------------------------------------ eventos
$('#formLogin').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = $('#btnEntrar'); const erro = $('#erroLogin');
  b.disabled = true; b.textContent = 'Entrando…'; erro.classList.add('oculto');
  try {
    await entrar($('#email').value.trim(), $('#senha').value);
    $('#senha').value = '';
    await abrir();
  } catch (e) {
    erro.textContent = /invalid/i.test(e.message) ? 'E-mail ou senha não conferem.' : e.message;
    erro.classList.remove('oculto');
  } finally { b.disabled = false; b.textContent = 'Entrar'; }
});

$('#btnSair').addEventListener('click', () => { esquecer(); location.reload(); });
$('#btnAtualizar').addEventListener('click', async () => {
  const b = $('#btnAtualizar'); b.disabled = true; b.textContent = 'Atualizando…';
  try { await carregar(); desenhar(); } catch (e) { alert('Não atualizou: ' + e.message); }
  finally { b.disabled = false; b.textContent = 'Atualizar'; }
});
$$('#visao .tab').forEach(el => el.addEventListener('click', () => {
  visao = el.dataset.v;
  $$('#visao .tab').forEach(x => x.classList.toggle('on', x === el));
  desenhar();
}));

async function abrir() {
  mostrarPainel();
  try {
    await carregar();
    desenhar();
  } catch (e) {
    // sem o cartao do portal a consulta volta vazia ou negada: explica em vez de mostrar tela em branco
    $('#avisos').innerHTML = '<div class="aviso">Não consegui carregar a carteira: ' + esc(e.message)
      + '<br>Se você acabou de ganhar acesso, saia e entre de novo. Se o acesso ainda não foi liberado, '
      + 'peça o cartão <b>Revisão Fiscal</b> no portal.</div>';
  }
}

(async () => { if (await retomar()) abrir(); })();
</script>
